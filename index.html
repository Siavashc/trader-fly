<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trader Fly — the trading desk</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0d12; color:#e8e6dd;
    font-family:'Segoe UI',system-ui,Tahoma,sans-serif; user-select:none; }
  #scene { position:fixed; inset:0; display:block; }

  /* ---------- top bar ---------- */
  #topbar { position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); left:10px; right:10px;
    display:flex; align-items:center; gap:8px; z-index:10; pointer-events:none; flex-wrap:wrap; }
  .chip { background:rgba(12,15,22,.72); border:1px solid rgba(255,255,255,.10);
    border-radius:12px; padding:6px 11px; font-size:12px; line-height:1.4;
    backdrop-filter:blur(8px); white-space:nowrap; }
  .chip .lbl { color:#8b93a7; font-size:9.5px; letter-spacing:.08em; display:block; text-transform:uppercase; }
  .chip b { font-size:14px; font-variant-numeric:tabular-nums; }
  #price { color:#7fe0a8; } #price.neg { color:#ff6b81; }
  #feed { width:8px; height:8px; border-radius:50%; display:inline-block;
    margin-right:5px; background:#5fe08a; box-shadow:0 0 6px #5fe08a; }
  #feed.sim { background:#e8b34a; box-shadow:0 0 6px #e8b34a; }

  /* ---------- side panel ---------- */
  #panel { position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); right:10px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 10px); width:322px; z-index:12;
    display:flex; flex-direction:column; gap:9px; overflow:hidden auto; scrollbar-width:none;
    transition:transform .3s ease; }
  #panel::-webkit-scrollbar { display:none; }
  #panel.hidden { transform:translateX(calc(100% + 14px)); }
  .card { background:rgba(13,16,24,.78); border:1px solid rgba(255,255,255,.09);
    border-radius:16px; padding:13px 14px; backdrop-filter:blur(10px); flex-shrink:0; }
  .card h3 { font-size:10px; letter-spacing:.12em; color:#8b93a7; text-transform:uppercase;
    margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; }
  .big { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
  .pos { color:#7fe0a8; } .neg { color:#ff6b81; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:12.5px; }
  .grid .k { color:#8b93a7; font-size:10.5px; }
  .grid .v { font-variant-numeric:tabular-nums; font-weight:600; }
  .bar { height:5px; border-radius:3px; background:#232838; margin-top:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#35d07f,#7fe0a8); border-radius:3px; }
  #poscard { display:none; }
  #poscard .side { display:inline-block; padding:2px 9px; border-radius:8px; font-weight:700;
    font-size:12px; margin-right:7px; }
  #poscard .side.long { background:rgba(53,208,127,.16); color:#5fe08a;
    border:1px solid rgba(95,224,168,.45); }
  #poscard .side.short { background:rgba(255,84,112,.14); color:#ff6b81;
    border:1px solid rgba(255,107,129,.45); }
  #closebtn { margin-top:9px; width:100%; padding:9px; border-radius:11px; cursor:pointer;
    background:rgba(255,84,112,.13); border:1px solid rgba(255,107,129,.5); color:#ffb3c0;
    font-size:12.5px; font-weight:600; transition:transform .08s; }
  #closebtn:active { transform:scale(.96); }
  #sort { display:flex; gap:5px; margin-bottom:9px; flex-wrap:wrap; }
  #sort button { flex:1; min-width:62px; background:rgba(255,255,255,.05); color:#9aa2b5;
    border:1px solid rgba(255,255,255,.10); border-radius:9px; padding:6px 4px;
    font-size:10.5px; cursor:pointer; transition:all .15s; }
  #sort button.on { background:rgba(95,224,168,.14); color:#7fe0a8;
    border-color:rgba(95,224,168,.5); }
  #trades { display:flex; flex-direction:column; max-height:38vh; overflow-y:auto; scrollbar-width:none; }
  #trades::-webkit-scrollbar { display:none; }
  .tr { display:flex; align-items:center; gap:8px; padding:7px 2px;
    border-bottom:1px dashed rgba(255,255,255,.07); font-size:12px; }
  .tr:last-child { border-bottom:none; }
  .tr .tm { color:#8b93a7; font-size:10px; width:66px; font-variant-numeric:tabular-nums; }
  .tr .sd { width:48px; font-weight:700; font-size:11px; }
  .tr .sd.long { color:#5fe08a; } .tr .sd.short { color:#ff6b81; }
  .tr .pl { flex:1; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .tr .dur { color:#66708a; font-size:9.5px; width:44px; text-align:right; }
  #mood { font-size:11.5px; color:#aab2c5; line-height:1.5; }
  #mood b { color:#e8d78a; }

  #panelbtn { position:fixed; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:13; width:46px; height:46px; border-radius:50%; display:none; cursor:pointer;
    background:rgba(12,15,22,.85); border:1px solid rgba(255,255,255,.16); color:#e8e6dd;
    font-size:20px; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
  #toast { position:fixed; top:18%; left:50%; transform:translateX(-50%) translateY(-8px);
    z-index:20; background:rgba(12,15,22,.92); border:1px solid rgba(95,224,168,.4);
    color:#e8e6dd; border-radius:12px; padding:10px 16px; font-size:13px; line-height:1.55;
    text-align:center; opacity:0; transition:all .3s; pointer-events:none; max-width:86vw; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:760px) {
    #panelbtn { display:flex; }
    #panel { width:min(88vw, 322px); }
    #panel.hidden { transform:translateX(calc(100% + 14px)); }
  }
  @media (min-width:761px) { #panel { display:flex !important; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="topbar">
  <div class="chip"><span class="lbl">🪰 Trader Fly</span><b style="font-size:12px">BTC-USD · paper</b></div>
  <div class="chip"><span class="lbl">Price</span><b id="price">$—</b></div>
  <div class="chip"><span class="lbl">Session P/L</span><b id="pnlchip">—</b></div>
  <div class="chip"><span class="lbl">Desk time</span><b id="clock">—</b></div>
  <div class="chip"><span id="feed"></span><span class="lbl" style="display:inline">feed</span></div>
</div>

<button id="panelbtn">📊</button>

<div id="panel">
  <div class="card">
    <h3>Account</h3>
    <div class="big" id="totalpnl">—</div>
    <div class="grid" style="margin-top:9px">
      <div><div class="k">Equity</div><div class="v" id="equity">—</div></div>
      <div><div class="k">Win rate</div><div class="v" id="winrate">—</div></div>
      <div><div class="k">Wins</div><div class="v pos" id="wins">0</div></div>
      <div><div class="k">Losses</div><div class="v neg" id="losses">0</div></div>
    </div>
    <div class="bar"><i id="winbar" style="width:0%"></i></div>
  </div>

  <div class="card" id="poscard">
    <h3>Open position</h3>
    <div><span class="side" id="posside">LONG</span><span id="posnotional">$1,000</span></div>
    <div class="grid" style="margin-top:9px">
      <div><div class="k">Entry</div><div class="v" id="posentry">—</div></div>
      <div><div class="k">Now</div><div class="v" id="posnow">—</div></div>
      <div><div class="k">Unrealized</div><div class="v" id="posupnl">—</div></div>
      <div><div class="k">Exit</div><div class="v">SL −0.35% · TP +0.7%</div></div>
    </div>
    <button id="closebtn">Take profit now</button>
  </div>

  <div class="card">
    <h3>🧠 Fly mood</h3>
    <div id="mood">warming up…</div>
  </div>

  <div class="card">
    <h3>Trade history</h3>
    <div id="sort">
      <button data-s="time_desc" class="on">Newest</button>
      <button data-s="time_asc">Oldest</button>
      <button data-s="pnl_desc">Best</button>
      <button data-s="pnl_asc">Worst</button>
    </div>
    <div id="trades"></div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
window.addEventListener('error', e => {
  const t = document.getElementById('toast');
  if (t) { t.classList.add('show'); t.textContent = '⚠️ ' + e.message; }
});
// ===========================================================================
// Telegram integration
// ===========================================================================
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0b0d12'); tg.setBackgroundColor('#0b0d12'); } catch (e) {} }

// ===========================================================================
// state polling
// ===========================================================================
const S = {
  price: 0, priceShown: 0, candles: [], position: null, upnl: 0,
  pnl_total: 0, equity_start: 1000, wins: 0, losses: 0, trades: [],
  notes: [], feed_ok: false, lastTradeId: 0, firstLoad: true,
};
let sortMode = 'time_desc';

// ===========================================================================
// state polling (reads the fly's state from its secret GitHub Gist — the
// laptop publishes every ~60s; no server needed, URL is permanent)
// ===========================================================================
const GIST_RAW = 'https://gist.githubusercontent.com/Siavashc/e763d0438ee521221ffc7d393bbaece0/raw/state.json';
const BOT_LINK = 'https://t.me/TraderMagasbot';

async function poll() {
  try {
    const r = await fetch(GIST_RAW + '?t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    const prevPos = S.position;
    Object.assign(S, d);
    S.priceShown = S.priceShown || d.price;
    // detect a fresh open/close for the fly's speech bubble + toast
    const last = d.trades.length ? d.trades[d.trades.length - 1] : null;
    if (last && !S.firstLoad && last.id !== S.lastTradeId) {
      flySay(last.pnl >= 0 ? '$$$' : 'ouch!');
      toast(`🪰 ${last.side} closed <b style="color:${last.pnl >= 0 ? '#7fe0a8' : '#ff6b81'}">$${last.pnl.toFixed(2)}</b> — ${last.pnl >= 0 ? 'dopamine reward 🍰' : 'dopamine punishment ⚡'}`);
      if (last.pnl >= 0) confetti();
    }
    if (d.position && (!prevPos || prevPos.t_open !== d.position.t_open) && !S.firstLoad) {
      flySay(d.position.side === 'LONG' ? 'buy!' : 'sell!');
      toast(`🪰 ${d.position.side} opened @ $${d.position.entry.toLocaleString()} — ${d.position.why || ''}`);
    }
    if (last) S.lastTradeId = last.id;
    S.firstLoad = false;
  } catch (e) { /* keep last state */ }
}

setInterval(poll, 2000); poll();

// ===========================================================================
// helpers
// ===========================================================================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
function fmt$(v) { return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 }); }
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(20260924); // deterministic scene randomness

// --- palette keyframes over the day (user's local clock) ---
const PAL = [
  // h, skyTop, skyHorizon, wall, floor, city, cityLit, warm
  [0.0, '#070b1d', '#121a33', '#221f2b', '#181620', '#0c1322', 1, 0],
  [5.0, '#0b1230', '#24304f', '#242230', '#191722', '#0e1526', 1, 0],
  [6.6, '#2c3d6e', '#e98a5a', '#3a3238', '#231d22', '#1a2130', 0.4, .3],
  [9.0, '#63aede', '#b8dcf2', '#4a4340', '#2b2521', '#2c3a4d', 0, 0],
  [15.0, '#5aa3dc', '#c2e2f2', '#4a4340', '#2b2521', '#2c3a4d', 0, 0],
  [17.6, '#51507c', '#f0895e', '#3d3438', '#241e20', '#232c3f', .3, .55],
  [19.4, '#1a2148', '#5a3a54', '#2a2632', '#1b1820', '#141c30', 1, .25],
  [22.0, '#080d20', '#131c38', '#221f2b', '#181620', '#0c1322', 1, 0],
  [24.0, '#070b1d', '#121a33', '#221f2b', '#181620', '#0c1322', 1, 0],
];
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t)), g = Math.round(lerp(pa >> 8 & 255, pb >> 8 & 255, t)), b2 = Math.round(lerp(pa & 255, pb & 255, t));
  return `rgb(${r},${g},${b2})`;
}
const HOUR_OVERRIDE = (() => { const q = new URLSearchParams(location.search).get('hour'); return q === null ? null : parseFloat(q); })();
function dayPal() {
  const d = new Date();
  let h = d.getHours() + d.getMinutes() / 60;
  if (HOUR_OVERRIDE !== null && !isNaN(HOUR_OVERRIDE)) h = HOUR_OVERRIDE;
  let i = 0; while (i < PAL.length - 2 && PAL[i + 1][0] < h) i++;
  const a = PAL[i], b = PAL[i + 1];
  const t = clamp((h - a[0]) / (b[0] - a[0]), 0, 1);
  const mix = j => mixHex(a[j], b[j], t);
  const daylight = clamp(Math.sin((h - 6) / 12 * Math.PI), 0, 1); // 0 night .. 1 noon
  return { top: mix(1), hor: mix(2), wall: mix(3), floor: mix(4), city: mix(5),
    lit: lerp(a[6], b[6], t), warm: lerp(a[7], b[7], t), daylight, hour: h };
}
// star field + skyline (deterministic)
const STARS = Array.from({ length: 70 }, () => ({ x: R(), y: R() * .75, r: .5 + R() * 1.1, tw: R() * 6.28 }));
function skyline(seed, n, minH, maxH) {
  const rr = mulberry(seed); const arr = []; let x = 0;
  for (let i = 0; i < n; i++) {
    const w = 18 + rr() * 46, h = 60 + rr() * 150;
    const wins = []; const cols = Math.floor(w / 11), rows = Math.floor(h / 13);
    for (let c = 0; c < cols; c++) for (let r2 = 0; r2 < rows; r2++) if (rr() < .38) wins.push([c, r2]);
    arr.push({ x, w, h, wins, cols, rows, spire: rr() < .18 });
    x += w + 2 + rr() * 6;
  }
  return arr;
}
const SKY1 = skyline(7, 26), SKY2 = skyline(99, 20);

// ===========================================================================
// scene
// ===========================================================================
const cvs = $('scene'), ctx = cvs.getContext('2d');
const LW = 1280, LH = 800;              // logical scene size
let scale = 1, ox = 0, oy = 0;

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  cvs.style.width = innerWidth + 'px'; cvs.style.height = innerHeight + 'px';
  // cover-scale the scene; on narrow screens bias the crop toward the desk+fly
  scale = Math.max(innerWidth / LW, innerHeight / LH) * dpr;
  ox = (innerWidth * dpr - LW * scale) / 2;
  oy = (innerHeight * dpr - LH * scale) / 2;
  if (innerWidth < 761) {
    const over = LW * scale - innerWidth * dpr;          // horizontal overflow > 0
    if (over > 0) ox -= over * .14;                      // center ~ x 760 (desk)
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
addEventListener('resize', resize); resize();

// desk geometry (logical coords)
const G = {
  horizon: 545,
  win: { x: 130, y: 95, w: 480, h: 370 },
  deskTop: 452, deskFront: 500, deskX: 340, deskW: 890,
  mon: { x: 596, y: 200, w: 292, h: 218 },
  mon2: { x: 424, y: 262, w: 152, h: 158 },
  flyX: 742, flyY: 496, flyScale: .82,
  chair: { x: 640, y: 508, w: 204, h: 200 },
};

function drawScene(t, pal) {
  const night = 1 - pal.daylight;
  // ---- room shell ----
  ctx.fillStyle = pal.wall; ctx.fillRect(-ox / scale - 4, -oy / scale - 4, LW + 8, G.horizon + 8);
  ctx.fillStyle = pal.floor; ctx.fillRect(-ox / scale - 4, G.horizon, LW + 8, LH - G.horizon + 8);
  // floor boards hint
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  for (let i = 0; i < 7; i++) ctx.fillRect(G.horizon + i * 38, G.horizon + i * 38 * .0, LW, 2 + i * 0);
  for (let y = G.horizon + 14; y < LH; y += 34) { ctx.globalAlpha = .10; ctx.fillRect(0, y, LW, 2); ctx.globalAlpha = 1; }

  drawWindow(t, pal, night);
  drawWallDecor(t, pal);
  drawRug();
  drawDesk(pal, night);
  drawMonitorSide(t, pal, night);
  drawMonitorMain(t, pal, night);
  drawDeskItems(t, pal, night);
  drawChair(t);
  drawFly(t, night);
  drawLighting(pal, night);
}

// ---------- window: sky, sun/moon, stars, skyline ----------
function drawWindow(t, pal, night) {
  const w = G.win;
  ctx.save();
  ctx.beginPath(); ctx.rect(w.x, w.y, w.w, w.h); ctx.clip();
  // sky gradient
  const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
  g.addColorStop(0, pal.top); g.addColorStop(1, pal.hor);
  ctx.fillStyle = g; ctx.fillRect(w.x, w.y, w.w, w.h);

  const sunT = (pal.hour - 6) / 12;                     // 0..1 across day
  const sunAlt = sunT >= 0 && sunT <= 1 ? Math.sin(sunT * Math.PI) : 0;
  // stars
  if (night > .25) {
    for (const s of STARS) {
      const a = (night - .25) / .75 * (.45 + .55 * Math.abs(Math.sin(t * 1.7 + s.tw)));
      ctx.globalAlpha = a * .9;
      ctx.fillStyle = '#dfe8ff';
      ctx.beginPath(); ctx.arc(w.x + s.x * w.w, w.y + s.y * w.h, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // moon (night) / sun (day)
  if (sunT > -.08 && sunT < 1.08 && sunAlt > 0) {
    const sx = w.x + w.w * (.12 + sunT * .78), sy = w.y + w.h * (.78 - sunAlt * .62);
    ctx.save(); ctx.shadowColor = 'rgba(255,214,140,.9)'; ctx.shadowBlur = 44;
    ctx.fillStyle = '#ffd98f'; ctx.beginPath(); ctx.arc(sx, sy, 15, 0, 7); ctx.fill(); ctx.restore();
  } else {
    const mh = (pal.hour - 19 + 24) % 24;                 // hours past dusk
    const mx = w.x + w.w * (.18 + clamp(mh / 10, 0, 1) * .62), my = w.y + w.h * (.30 - clamp(mh / 10, 0, .2));
    ctx.save(); ctx.shadowColor = 'rgba(210,225,255,.9)'; ctx.shadowBlur = 36;
    ctx.fillStyle = '#e8eef8'; ctx.beginPath(); ctx.arc(mx, my, 13, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = pal.top; ctx.globalAlpha = .85;
    ctx.beginPath(); ctx.arc(mx + 6, my - 4, 11, 0, 7); ctx.fill(); ctx.restore(); ctx.globalAlpha = 1;
  }
  // clouds (day)
  if (pal.daylight > .2) {
    ctx.fillStyle = 'rgba(255,255,255,' + (.28 * pal.daylight) + ')';
    for (let i = 0; i < 3; i++) {
      const cx2 = w.x + ((t * (5 + i * 3) + i * 260) % (w.w + 160)) - 80;
      const cy2 = w.y + 46 + i * 44 + Math.sin(t * .3 + i) * 4;
      for (const [dx, dy, r] of [[0, 0, 22], [20, 6, 15], [-20, 8, 14], [6, -10, 13]])
        { ctx.beginPath(); ctx.arc(cx2 + dx, cy2 + dy, r, 0, 7); ctx.fill(); }
    }
  }
  // skyline far
  ctx.fillStyle = pal.city;
  drawSky(SKY2, w.x + 20, w.y + w.h, w.w - 60, .62, pal, t, 0);
  // skyline near + windows
  drawSky(SKY1, w.x - 10, w.y + w.h, w.w + 30, 1, pal, t, 1);
  ctx.restore();

  // frame
  ctx.strokeStyle = '#0d0f14'; ctx.lineWidth = 14;
  ctx.strokeRect(w.x - 7, w.y - 7, w.w + 14, w.h + 14);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.strokeRect(w.x - 1, w.y - 1, w.w + 2, w.h + 2);
  // mullions
  ctx.fillStyle = '#0d0f14';
  ctx.fillRect(w.x + w.w / 2 - 5, w.y, 10, w.h);
  ctx.fillRect(w.x, w.y + w.h * .42 - 5, w.w, 10);
  // glass glare
  ctx.save(); ctx.globalAlpha = .05; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(w.x + 40, w.y); ctx.lineTo(w.x + 130, w.y); ctx.lineTo(w.x + 30, w.y + w.h); ctx.lineTo(w.x + 0, w.y + w.h); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w.x + w.w - 150, w.y); ctx.lineTo(w.x + w.w - 90, w.y); ctx.lineTo(w.x + w.w - 190, w.y + w.h); ctx.lineTo(w.x + w.w - 250, w.y + w.h); ctx.fill();
  ctx.restore();
  // sill
  ctx.fillStyle = '#14161c'; ctx.fillRect(w.x - 20, w.y + w.h, w.w + 40, 13);
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(w.x - 20, w.y + w.h, w.w + 40, 3);
  // little plant on sill
  drawSillPlant(w.x + w.w - 42, w.y + w.h, t);
}
function sunA(pal) { const s = (pal.hour - 6) / 12; return (s > 0 && s < 1) ? Math.sin(s * Math.PI) : 0; }
function drawSky(arr, bx, by, span, k, pal, t, near) {
  for (const b of arr) {
    const x = bx + (b.x / 950) * span, w = b.w * (span / 950), h = b.h * k;

  }
  // vignette
  const v = ctx.createRadialGradient(LW / 2, LH / 2, LH * .42, LW / 2, LH / 2, LW * .72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(4,5,9,.42)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, LW, LH);
}

// ---------- confetti on wins ----------
const parts = [];
function confetti() {
  for (let i = 0; i < 26; i++)
    parts.push({ x: G.flyX + (Math.random() - .5) * 60, y: G.flyY - 80, vx: (Math.random() - .5) * 4, vy: -2 - Math.random() * 3, life: 1, c: ['#ffd98f', '#7fe0a8', '#8ecdf5', '#ff9db1'][i % 4] });
}
function drawParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += .06; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, 5, 5);
  }
  ctx.globalAlpha = 1;
}

// ===========================================================================
// main loop
// ===========================================================================
let last = performance.now();
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
  // smooth price lerp for the monitor
  if (S.price) S.priceShown = S.priceShown ? lerp(S.priceShown, S.price, .08) : S.price;
  const pal = dayPal();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  drawScene(t, pal);
  flySayCheck();
  drawParts(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ===========================================================================
// HUD rendering
// ===========================================================================
function hud() {
  // top bar
  const p = $('price');
  p.textContent = '$' + Math.round(S.priceShown).toLocaleString();
  p.className = S.upnl < 0 ? 'neg' : '';
  const tot = $('pnlchip');
  const show = S.position ? S.upnl : S.pnl_total;
  tot.textContent = (show >= 0 ? '+' : '') + '$' + Math.abs(show).toFixed(2);
  tot.className = show >= 0 ? 'pos' : 'neg';
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('feed').className = S.feed_ok ? '' : 'sim';

  // account card
  const tp = $('totalpnl');
  tp.textContent = (S.pnl_total >= 0 ? '+$' : '-$') + Math.abs(S.pnl_total).toFixed(2);
  tp.className = 'big ' + (S.pnl_total >= 0 ? 'pos' : 'neg');
  $('equity').textContent = '$' + (S.equity_start + S.pnl_total).toLocaleString(undefined, { maximumFractionDigits: 2 });
  const n = S.wins + S.losses;
  $('winrate').textContent = n ? Math.round(S.wins / n * 100) + '%' : '—';
  $('wins').textContent = S.wins; $('losses').textContent = S.losses;
  $('winbar').style.width = n ? (S.wins / n * 100) + '%' : '0%';

  // position card
  const pc = $('poscard');
  if (S.position) {
    pc.style.display = 'block';
    const ps = $('posside');
    ps.textContent = S.position.side; ps.className = 'side ' + S.position.side.toLowerCase();
    $('posentry').textContent = '$' + S.position.entry.toLocaleString();
    $('posnow').textContent = '$' + Math.round(S.priceShown).toLocaleString();
    const u = $('posupnl');
    u.textContent = (S.upnl >= 0 ? '+$' : '-$') + Math.abs(S.upnl).toFixed(2);
    u.className = 'v ' + (S.upnl >= 0 ? 'pos' : 'neg');
  } else pc.style.display = 'none';

  // mood
  const notes = S.brain_notes || [];
  const m = notes.length ? notes[notes.length - 1] : null;
  if (m) {
    const ts = new Date(m.t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('mood').innerHTML = `<b>${ts}</b> · $${Math.round(m.price).toLocaleString()} → ${m.stim} → <b>${m.action}</b><br><span style="color:#66708a">${(m.why || '').slice(0, 60)}</span>`;
  }

  // trades
  let list = S.trades.slice();
  list.sort((a, b) => {
    switch (sortMode) {
      case 'time_asc': return a.t_close - b.t_close;
      case 'pnl_desc': return b.pnl - a.pnl;
      case 'pnl_asc': return a.pnl - b.pnl;
      default: return b.t_close - a.t_close;
    }
  });
  $('trades').innerHTML = list.slice(0, 60).map(tr => {
    const dt = new Date(tr.t_close * 1000);
    const tm = dt.toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const mins = Math.max(1, Math.round((tr.t_close - (tr.t_open || tr.t_close)) / 60000));
    const hold = mins < 60 ? mins + 'm' : Math.floor(mins / 60) + 'h' + String(mins % 60).padStart(2, '0');
    return `<div class="tr"><span class="tm">${tm}</span><span class="side ${tr.side.toLowerCase()}">${tr.side}</span>` +
      `<span class="pl ${tr.pnl >= 0 ? 'pos' : 'neg'}">${tr.pnl >= 0 ? '+' : '-'}$${Math.abs(tr.pnl).toFixed(2)}</span>` +
      `<span class="dur">${hold}</span></div>`;
  }).join('') || '<div style="color:#66708a;font-size:11.5px">No closed trades yet — warming up…</div>';
}
setInterval(hud, 500); hud();

// sort buttons
document.querySelectorAll('#sort button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#sort button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); sortMode = b.dataset.s; hud();
});

// panel toggle (mobile)
const panel = $('panel');
$('panelbtn').onclick = () => panel.classList.toggle('hidden');
if (innerWidth < 761) panel.classList.add('hidden');

// manual close — sends the user to the bot's /close command (works without a tunnel)
$('closebtn').onclick = () => {
  const go = () => {
    if (tg && tg.openTelegramLink) tg.openTelegramLink(BOT_LINK);
    else window.open(BOT_LINK, '_blank');
  };
  toast('🪰 Send <b>/close</b> to the bot to close the position now');
  setTimeout(go, 900);
};

function toast(html) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 4200);
}
</script>
